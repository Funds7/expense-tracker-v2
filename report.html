<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports</title>
  <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
</head>
<body>

  <div class="container">

    <!-- NAVIGATION -->
    <nav class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="add.html">➕ Add</a>
  <a href="report.html">📊 Reports</a>
  <a href="settings.html">⚙️ Settings</a>

    <h1>Reports Dashboard</h1>

    <!-- MONTHLY REPORT -->
    <div class="monthly-dashboard">
      <h2>📅 Monthly Report</h2>

      <div class="dash-grid">
        <div class="dash-card">
          <h4>Income</h4>
          <p id="m-income">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Expense</h4>
          <p id="m-expense">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Net</h4>
          <p id="m-net">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Transactions</h4>
          <p id="m-count">0</p>
        </div>

        <div class="dash-card">
          <h4>Biggest Expense</h4>
          <p id="m-biggest">₦0</p>
        </div>
      </div>
    </div>

    <!-- WEEKLY REPORT -->
    <div class="monthly-dashboard">
      <h2>📊 Weekly Report</h2>

      <div class="dash-grid">
        <div class="dash-card">
          <h4>Income</h4>
          <p id="w-income">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Expense</h4>
          <p id="w-expense">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Net</h4>
          <p id="w-net">₦0</p>
        </div>

        <div class="dash-card">
          <h4>Transactions</h4>
          <p id="w-count">0</p>
        </div>

        <div class="dash-card">
          <h4>Biggest Expense</h4>
          <p id="w-biggest">₦0</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ONLY REPORT LOGIC -->
  <script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
