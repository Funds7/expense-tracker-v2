<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker - Dashboard</title>

  <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
</head>

<body>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splash">
  <div class="splash-content">
    <h1>💰 Expense Tracker</h1>
    <p>Smart Finance App</p>
    <div class="loader"></div>
  </div>
</div>

<!-- ================= APP CONTENT ================= -->
<div class="container">

  <h1>Expense Tracker</h1>

  <p id="edit-status"></p>

  <button id="darkToggle">🌙 Dark Mode</button>

  <!-- NAVIGATION -->
<nav class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="add.html">➕ Add</a>
  <a href="report.html">📊 Reports</a>
  <a href="settings.html">⚙️ Settings</a>
</nav>

<!-- BALANCE CARD -->
<div class="premium-balance-card">

  <div class="balance-top">
    <p>Total Balance</p>
    <h1 id="balance">₦0</h1>
  </div>

  <div id="budget-warning"></div>

  <div class="premium-summary">

    <div class="premium-card income-card">
      <span>Income</span>
      <h3 id="income">₦0</h3>
    </div>

    <div class="premium-card expense-card">
      <span>Expense</span>
      <h3 id="expense">₦0</h3>
    </div>

  </div>
</div>

<!-- PREMIUM CHART -->
<div class="chart-card">
  <div class="chart-header">
    <h3>Financial Overview</h3>
    <p>This Month</p>
  </div>

  <canvas id="expenseChart"></canvas>
</div>

  <!-- SEARCH -->
  <input type="text" id="search" placeholder="Search transaction..." />

  <!-- FILTER -->
  <div class="filter-box">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="income">Income</button>
    <button class="filter-btn" data-filter="expense">Expense</button>
  </div>

  <!-- TRANSACTION LIST -->
  <ul id="list"></ul>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="index.js"></script>
<script src="app.js"></script>
</body>
</html>
